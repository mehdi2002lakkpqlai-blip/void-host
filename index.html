<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">
  <title>VOID HOST</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080a0f;
      color: #e8edf5;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px 7%;
      border-bottom: 1px solid #242a36;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 23px; font-weight: bold; letter-spacing: 3px; }
    .logo span { color: #ff633e; }
    .status { color: #8b96a8; font-size: 12px; }
    main {
      max-width: 800px;
      margin: 100px auto;
      padding: 24px;
      text-align: center;
    }
    .tag {
      color: #ff633e;
      letter-spacing: 3px;
      font-size: 12px;
    }
    h1 { font-size: clamp(40px, 9vw, 76px); margin: 22px 0; }
    h1 span { color: #ff633e; }
    p { color: #98a2b3; line-height: 1.9; }
    .panel {
      margin-top: 38px;
      padding: 25px;
      border: 1px solid #292f3c;
      border-radius: 14px;
      background: #10131b;
    }
    .panel h2 { font-size: 19px; }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 23px;
      background: #ff633e;
      color: #080a0f;
      text-decoration: none;
      font-weight: bold;
      border-radius: 7px;
    }
    footer {
      text-align: center;
      padding: 25px;
      border-top: 1px solid #242a36;
      color: #697386;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">VOID<span>.</span>HOST</div>
    <div class="status">INDEPENDENT WEB PLATFORM</div>
  </header>
  <main>
    <div class="tag">YOUR SPACE ON THE WEB</div>
    <h1>Build beyond<br><span>limits.</span></h1>
    <p>A new home for websites, creators and digital ideas.</p>
    <section class="panel">
      <h2>Your website starts here.</h2>
      <p>Explore the platform as we build the tools to publish websites online.</p>
      <a class="btn" href="https://github.com">GET STARTED</a>
    </section>
  </main>
  <footer>VOID HOST · VERSION 0.1 · UNDER DEVELOPMENT</footer>
</body>
</html>
